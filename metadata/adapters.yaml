# The sequencing adapters of Oxford Nanopore which flucut searches at
# the ends of a read where no primer was found (see the manual, and
# adapters.h for what the program does with them).
#
# The build turns this file into the table of the program
# (scripts/adapters-table.awk writes obj/adapters-table.h): a kit is
# added or changed here, not in the sources.
#
# A read of a ligation library begins with the adapter - with native
# barcoding the ligation adapter, then the barcode flanked by two fixed
# sequences - and, if it was sequenced to the end, ends with the reverse
# complement of the adapter of the other end of the molecule.
#
# The sequences are from Dorado (github.com/nanoporetech/dorado, commit
# 8b8fc5d: dorado/utils/barcode_kits.cpp and
# dorado/demux/adapter_primer_kits.cpp). No sequence is derived or
# guessed.
#
# Records
#
#   sequence   a named sequence, so that one written once can be used by
#              several kits
#     bases    the bases; N matches any base
#     note     what it is
#
#   kit        a kit, by the name used in --adapters
#     start    the adapter as it is found at the start of a read - a
#              space-separated list of sequence names and literal bases,
#              concatenated - or none
#     end      the adapter as it is found at the end of a read, or none
#     note     which kits of the vendor it covers
#
# The barcode is searched as Ns, which match any base: any barcode of
# the kit is recognised and none is identified, since the reads normally
# come already demultiplexed and flucut does not demultiplex.
#
# Avoid ": " and "#" in the values.

- sequence: barcode
  bases: NNNNNNNNNNNNNNNNNNNNNNNN
  note: a barcode of 24 bases, of unknown sequence

- sequence: rapid-adapter
  bases: GTTTTCGCATTTATCGTGAAACGCTTTCGCGTTTTTCGTGCGCCGCTTCA
  note: the 50 bases of the rapid adapter, after the barcode

- kit: nb
  start: ATTGCTAAGGTTAA barcode CAGCACCT
  end: GGTGCTG barcode TTAACCTTAGCAAT
  note: native barcoding, e.g. SQK-NBD114-24/96 and EXP-NBD114. The adapter at the end of the read is the reverse complement of the one at its start

- kit: rbk
  start: GCTTGGGTGTTTAACC barcode rapid-adapter
  end: none
  note: rapid barcoding, e.g. SQK-RBK114-24/96. It is found at the start of the read only

- kit: lsk
  start: CCTGTACTTCGTTCAGTTACGTATTGC
  end: AGCAATACGTAACTGAAC
  note: ligation without barcodes, e.g. SQK-LSK114
