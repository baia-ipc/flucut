# The built-in reference set: the NCBI accessions flucut downloads on
# first use and caches, so that a run can be classified against
# references without the user providing any (see builtin-references.h).
#
# The build turns this file into the lists of the program
# (scripts/references-table.awk writes obj/references-table.h): a
# reference is added or changed here, not in the sources.
#
# Every record listed begins and ends with the conserved termini of the
# segments, the targets of the universal primers, so that the ends of
# the reads at a segment terminus are recognised as such, and every one
# carries its subtype in its description. The script
# scripts/find_builtin_references.py searches NCBI for records which
# fulfil this and writes the lists below.
#
# The subtype of a sample is the subtype of the HA and of the NA its
# reads are closest to, so every subtype needs references of its own:
# several of them, as the lineages of one subtype can lie decades
# apart, and the votes of the references of a subtype are counted
# together (see auto-settings.h). The other segments differ little
# between subtypes, and several isolates cover their diversity.
#
# Records
#
#   set        a set of references, by the type of influenza (A or B).
#              The groups after it belong to it, until the next set
#     version  the version of the set. The cache file is named after
#              it, so a changed list needs a new version or an old
#              cache would be reused
#     note     what the set is
#
#   group      a group of accessions within the set, by a name used
#              only here
#     accessions  the accessions, space-separated
#
# Avoid ": " and "#" in the values.

- set: A
  version: v3
  note: complete segments of influenza A, the HA of every subtype H1 to H16, the NA of every subtype N1 to N9, and the other six segments of isolates of several subtypes

