   <g id="text_1">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2530" x="9.40896" y="18.782437" transform="rotate(-0 9.40896 18.782437)">Both ends terminal, with references</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5d6b7a" transform="translate(349.36704 35.489676)">tails removed,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5d6b7a" transform="translate(349.36704 43.89159)">conserved termini kept</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2530" x="9.40896" y="82.286437" transform="rotate(-0 9.40896 82.286437)">An end internal or unknown (here the left one), or no references</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5d6b7a" transform="translate(349.36704 98.993676)">at that end the whole</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5d6b7a" transform="translate(349.36704 107.39559)">primer is removed</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2530" x="9.40896" y="145.790437" transform="rotate(-0 9.40896 145.790437)">Primer dimer</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5d6b7a" transform="translate(349.36704 162.497676)">the primers touch or</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5d6b7a" transform="translate(349.36704 170.89959)">overlap: nothing is kept</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2530" x="9.40896" y="209.294437" transform="rotate(-0 9.40896 209.294437)">The primer of the same end at both read ends</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5d6b7a" transform="translate(349.36704 217.599762)">the second copy, found in</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5d6b7a" transform="translate(349.36704 226.001676)">the other orientation, is</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5d6b7a" transform="translate(349.36704 234.40359)">removed with what lies</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5d6b7a" transform="translate(349.36704 242.805504)">beyond it</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2c9a5f" x="172.40256" y="56.977228" transform="rotate(-0 172.40256 56.977228)">kept</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2c9a5f" x="181.71648" y="120.481228" transform="rotate(-0 181.71648 120.481228)">kept</text>
   </g>
